name: Build NutriTracker Android APK

"on":
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nutritracker

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK Exists & Is Non-Empty
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file not found at $APK_PATH" >&2
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH" 2>/dev/null)
          echo "Found APK: $APK_PATH"
          echo "APK Size: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -le 0 ]; then
            echo "ERROR: APK file is empty!" >&2
            exit 1
          fi

      - name: Upload NutriTracker APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriTracker-Android-APK
          path: nutritracker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
